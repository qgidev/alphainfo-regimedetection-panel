<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AlphaInfo Regime Detection — dark navy badge, silver ring, light-blue signal
       that breaks from a calm regime into a volatile one at the midpoint. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F3F5"/>
      <stop offset="0.45" stop-color="#9DA3AE"/>
      <stop offset="0.75" stop-color="#E4E6EA"/>
      <stop offset="1" stop-color="#7F8694"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#141C2B"/>
      <stop offset="1" stop-color="#0B111C"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring)" stroke-width="11"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="#0A0F18" stroke-width="3" opacity="0.6"/>

  <!-- calm regime (left) -->
  <path d="M96 256
           q 20 -26 40 0 t 40 0 t 40 0 t 40 0"
        fill="none" stroke="#64B5F6" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- transition marker -->
  <line x1="256" y1="196" x2="256" y2="316" stroke="#64B5F6" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="2 14" opacity="0.85"/>
  <!-- volatile regime (right) -->
  <path d="M256 256
           L 274 196 L 292 300 L 310 176 L 328 322 L 346 190 L 364 296 L 382 226 L 398 268"
        fill="none" stroke="#64B5F6" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
